name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Self-test next-release version guard
        run: python .github/scripts/verify_next_release_version.py --self-test

      - name: Enforce versionCode bump when next-release is Ready
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/next-release' && github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          python .github/scripts/verify_next_release_version.py \
            --base-ref FETCH_HEAD \
            --head-file app/build.gradle.kts

      - name: Verify project policy
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          NAMESPACE="$(sed -n 's/.*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test "$APP_ID" = "com.aistudio.qrgenerator.kmpzqr"
          test "$NAMESPACE" = "$APP_ID"
          test -n "$VERSION_NAME"
          test "${VERSION_CODE:-0}" -gt 0
          if find app/src -type f -path '*/com/example/*' | grep -q .; then
            echo "Legacy com/example source is still active"
            exit 1
          fi
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Forbidden permission found in manifest"
            exit 1
          fi
          grep -Fq "QuickQR Business v${VERSION_NAME}" metadata.json

      - name: Compile, test, lint and release bundle
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease --stacktrace

      - name: Verify Room schema outputs
        shell: bash
        run: |
          set -euo pipefail
          test -d app/schemas
          mapfile -t SCHEMAS < <(find app/schemas -type f -name '*.json' -print | sort)
          test "${#SCHEMAS[@]}" -gt 0 || { echo "No Room schema JSON was generated"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("app/schemas").rglob("*.json"))
          if not files:
              raise SystemExit("No Room schema JSON was generated")
          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f"Empty Room schema JSON: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"Room schema is not a JSON object: {path}")
          print(f"PASS: validated {len(files)} Room schema JSON file(s)")
          PY

      - name: Verify built artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/quickqr-badging.txt
          grep -Fq "package: name='$APP_ID'" /tmp/quickqr-badging.txt
          grep -Fq "versionCode='$VERSION_CODE'" /tmp/quickqr-badging.txt
          grep -Fq "versionName='$VERSION_NAME'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.CAMERA'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" /tmp/quickqr-badging.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_BACKGROUND_LOCATION)" /tmp/quickqr-badging.txt; then
            echo "Forbidden permission found in built APK"
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          if unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF)$' >/dev/null; then
            echo "Expected unsigned CI AAB but signature files were found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-unsigned-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  instrumentation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator system image
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          echo "no" | avdmanager create avd \
            --force \
            --name quickqr_ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/quickqr_ci.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/quickqr-avds.txt
          grep -Fxq "quickqr_ci" /tmp/quickqr-avds.txt
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          diagnose() {
            echo "=== emulator diagnostics ==="
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            ls -la "$ANDROID_AVD_HOME" || true
            find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print || true
            adb devices -l || true
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            cat /tmp/quickqr-emulator.log || true
          }
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL_ARGS=(-accel on)
          else
            ACCEL_ARGS=(-accel off)
          fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd quickqr_ci \
            "${ACCEL_ARGS[@]}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > /tmp/quickqr-emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            diagnose
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            diagnose
            exit 124
          fi
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put system screen_off_timeout 1800000 || true
          adb shell svc power stayon true || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk
          adb devices -l

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run Android instrumentation tests
        run: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Collect visual screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quickqr-visual
          mkdir -p /tmp/quickqr-visual
          REMOTE_VISUAL="/sdcard/Pictures/QuickQR-Visual-QA"
          if adb shell test -d "$REMOTE_VISUAL"; then
            adb pull "$REMOTE_VISUAL" /tmp/quickqr-visual
          fi
          COUNT="$(find /tmp/quickqr-visual -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Visual screenshot count: $COUNT"
          test "$COUNT" -ge 30 || { echo "Expected at least 30 runtime visual evidence PNG files (15 screens x TH/EN)"; exit 1; }

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/quickqr-visual/
            /tmp/quickqr-emulator.log
          if-no-files-found: warn
          retention-days: 7



  android16-compat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 API 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user-api36"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd-api36"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "emulator"             "platforms;android-36"             "system-images;android-36;google_apis;x86_64"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          echo "no" | avdmanager create avd             --force             --name quickqr_api36             --package "system-images;android-36;google_apis;x86_64"             --device "pixel_2"             --path "$ANDROID_AVD_HOME/quickqr_api36.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/quickqr-api36-avds.txt
          grep -Fxq "quickqr_api36" /tmp/quickqr-api36-avds.txt

      - name: Boot Android 16 emulator
        shell: bash
        run: |
          set -euo pipefail
          diagnose() {
            echo "=== Android 16 emulator diagnostics ==="
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            adb devices -l || true
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            cat /tmp/quickqr-api36-emulator.log || true
          }
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL_ARGS=(-accel on)
          else
            ACCEL_ARGS=(-accel off)
          fi
          nohup "$ANDROID_HOME/emulator/emulator"             -avd quickqr_api36             "${ACCEL_ARGS[@]}"             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -no-metrics             -gpu swiftshader_indirect             -camera-back none             -camera-front none             > /tmp/quickqr-api36-emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            diagnose
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            diagnose
            exit 124
          fi
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "36"
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put system screen_off_timeout 1800000 || true
          adb shell svc power stayon true || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb devices -l

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run Android 16 phone compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_VISUAL="/sdcard/Pictures/QuickQR-Visual-QA"
          adb shell rm -rf "$REMOTE_VISUAL" || true
          gradle --no-daemon :app:connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=com.aistudio.qrgenerator.kmpzqr.Android16CompatibilityInstrumentedTest,com.aistudio.qrgenerator.kmpzqr.VisualMatrixInstrumentedTest             --stacktrace
          rm -rf /tmp/quickqr-api36-phone
          mkdir -p /tmp/quickqr-api36-phone
          test -n "$(adb shell find "$REMOTE_VISUAL" -maxdepth 1 -type f -name '*.png' -print -quit 2>/dev/null | tr -d '\r')" || { echo "Android 16 phone visual evidence directory is empty"; exit 1; }
          adb pull "$REMOTE_VISUAL" /tmp/quickqr-api36-phone
          COUNT="$(find /tmp/quickqr-api36-phone -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Android 16 phone visual screenshot count: $COUNT"
          test "$COUNT" -eq 30

      - name: Run Android 16 large-screen landscape compatibility tests
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 2560x1600
          adb shell wm density 320
          sleep 2
          SIZE="$(adb shell wm size | tail -n 1 | tr -d '\r')"
          DENSITY="$(adb shell wm density | tail -n 1 | tr -d '\r')"
          echo "$SIZE"
          echo "$DENSITY"
          echo "$SIZE" | grep -Fq "2560x1600"
          echo "$DENSITY" | grep -Fq "320"
          # 2560px / (320dpi / 160) = 1280dp width; 1600px => 800dp height.
          # This is a CI test configuration, not a claim about a specific retail tablet.
          REMOTE_VISUAL="/sdcard/Pictures/QuickQR-Visual-QA"
          adb shell rm -rf "$REMOTE_VISUAL" || true
          gradle --no-daemon :app:connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=com.aistudio.qrgenerator.kmpzqr.Android16CompatibilityInstrumentedTest,com.aistudio.qrgenerator.kmpzqr.VisualMatrixInstrumentedTest             --stacktrace
          rm -rf /tmp/quickqr-api36-large
          mkdir -p /tmp/quickqr-api36-large
          test -n "$(adb shell find "$REMOTE_VISUAL" -maxdepth 1 -type f -name '*.png' -print -quit 2>/dev/null | tr -d '\r')" || { echo "Android 16 large-screen visual evidence directory is empty"; exit 1; }
          adb pull "$REMOTE_VISUAL" /tmp/quickqr-api36-large
          COUNT="$(find /tmp/quickqr-api36-large -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Android 16 large-screen visual screenshot count: $COUNT"
          test "$COUNT" -eq 30

      - name: Reset Android 16 display overrides
        if: always()
        shell: bash
        run: |
          adb shell wm size reset || true
          adb shell wm density reset || true

      - name: Upload Android 16 compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-android16-compat
          path: |
            /tmp/quickqr-api36-phone/
            /tmp/quickqr-api36-large/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/quickqr-api36-emulator.log
          if-no-files-found: warn
          retention-days: 7

  physical-device:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'integration/next-release' }}
    needs: build
    runs-on: [self-hosted, Windows, X64, desktop-commander, dclite-project-quickqr-business]
    timeout-minutes: 25

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify existing Android SDK on physical host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            $env:ANDROID_HOME,
            $env:ANDROID_SDK_ROOT,
            (Join-Path $env:LOCALAPPDATA "Android\Sdk"),
            (Join-Path $env:USERPROFILE "AppData\Local\Android\Sdk"),
            (Join-Path $env:USERPROFILE ".android\sdk")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

          $sdkRoot = $null
          foreach ($candidate in $candidates) {
            $platformJar = Join-Path $candidate "platforms\android-36\android.jar"
            $buildToolsCandidate = Join-Path $candidate "build-tools\36.0.0"
            if (
              (Test-Path -LiteralPath $platformJar -PathType Leaf) -and
              (Test-Path -LiteralPath $buildToolsCandidate -PathType Container)
            ) {
              $sdkRoot = [IO.Path]::GetFullPath($candidate)
              break
            }
          }
          if (-not $sdkRoot) {
            throw ("No installed Android SDK with platform 36 + build-tools 36.0.0. Checked: " + ($candidates -join "; "))
          }

          $platformTools = Join-Path $sdkRoot "platform-tools"
          $buildTools = Join-Path $sdkRoot "build-tools\36.0.0"
          ("ANDROID_HOME=" + $sdkRoot) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ("ANDROID_SDK_ROOT=" + $sdkRoot) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath $platformTools -PathType Container) {
            $platformTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $buildTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Provision isolated Gradle 9.3.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runnerCacheRoot = Join-Path $env:LOCALAPPDATA "DesktopCommanderLite\project-runners\quickqr-business\qa-cache"
          $gradleUserHome = Join-Path $runnerCacheRoot "gradle-home"
          $distRoot = Join-Path $runnerCacheRoot "gradle-dist"
          $zipPath = Join-Path $runnerCacheRoot "gradle-9.3.1-bin.zip"
          New-Item -ItemType Directory -Force -Path $runnerCacheRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $gradleUserHome | Out-Null

          $gradleBin = Join-Path $distRoot "gradle-9.3.1\bin"
          $gradleExe = Join-Path $gradleBin "gradle.bat"
          if (-not (Test-Path -LiteralPath $gradleExe -PathType Leaf)) {
            Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -OutFile $zipPath -UseBasicParsing
            Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $distRoot | Out-Null
            Expand-Archive -LiteralPath $zipPath -DestinationPath $distRoot -Force
          }
          if (-not (Test-Path -LiteralPath $gradleExe -PathType Leaf)) {
            throw ("Gradle 9.3.1 executable missing after provisioning: " + $gradleExe)
          }

          ("GRADLE_USER_HOME=" + $gradleUserHome) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gradleBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gradleExe --version
          if ($LASTEXITCODE -ne 0) { throw "Gradle 9.3.1 version probe failed" }

      - name: Verify physical target and build exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "com.aistudio.qrgenerator.kmpzqr"

          if (-not (Get-Command adb -ErrorAction SilentlyContinue)) {
            throw "ADB is not available on the self-hosted runner"
          }

          $serials = @(
            (& adb devices) |
              Where-Object { $_ -match "`tdevice$" } |
              ForEach-Object { ($_ -split "`t")[0] }
          )
          $matches = @()
          foreach ($candidate in $serials) {
            $candidateModel = ((& adb -s $candidate shell getprop ro.product.model) -join "").Trim()
            if ($LASTEXITCODE -eq 0 -and $candidateModel -eq "RMX3241") {
              $matches += $candidate
            }
          }
          if ($matches.Count -ne 1) {
            throw "Expected exactly one authorized RMX3241 physical target; observed $($matches.Count) among $($serials.Count) authorized devices"
          }
          $serial = $matches[0]
          "QUICKQR_PHYSICAL_SERIAL=$serial" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $model = ((& adb -s $serial shell getprop ro.product.model) -join "").Trim()
          if ($model -ne "RMX3241") {
            throw "Physical target mismatch after binding: expected RMX3241"
          }
          $boot = ((& adb -s $serial shell getprop sys.boot_completed) -join "").Trim()
          if ($boot -ne "1") {
            throw "Physical target has not completed boot"
          }

          & gradle.bat --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) {
            throw "Windows physical candidate build failed"
          }

          New-Item -ItemType Directory -Force -Path "physical-evidence" | Out-Null
          "candidate_head=${{ github.event.pull_request.head.sha }}" | Set-Content "physical-evidence\summary.txt"
          "model=$model" | Add-Content "physical-evidence\summary.txt"
          "device_count=1" | Add-Content "physical-evidence\summary.txt"
          "boot_completed=true" | Add-Content "physical-evidence\summary.txt"

      - name: Install, verify version and launch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "com.aistudio.qrgenerator.kmpzqr"
          $serial = $env:QUICKQR_PHYSICAL_SERIAL
          if ([string]::IsNullOrWhiteSpace($serial)) {
            throw "Bound RMX3241 serial is unavailable"
          }
          $state = ((& adb -s $serial get-state 2>&1) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
            throw "Bound RMX3241 is not in adb device state"
          }

          $state = [ordered]@{
            fontScale = (((& adb -s $serial shell settings get system font_scale) -join "").Trim())
          }
          $state | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP "quickqr-physical-state.json")

          $apk = (Resolve-Path "app\build\outputs\apk\debug\app-debug.apk").Path
          $install = ((& adb -s $serial install -r -g $apk 2>&1) -join "`n")
          if ($LASTEXITCODE -ne 0 -or $install -notmatch "Success") {
            throw "APK install with QA runtime-permission grant failed; existing app data/package was not removed automatically. $install"
          }

          $gradleText = Get-Content "app\build.gradle.kts" -Raw
          $expectedName = [regex]::Match($gradleText, 'versionName\s*=\s*"([^"]+)"').Groups[1].Value
          $expectedCode = [regex]::Match($gradleText, 'versionCode\s*=\s*(\d+)').Groups[1].Value
          $installed = ((& adb -s $serial shell dumpsys package $packageName) -join "`n")
          $actualName = [regex]::Match($installed, 'versionName=([^\r\n]+)').Groups[1].Value.Trim()
          $actualCode = [regex]::Match($installed, 'versionCode=(\d+)').Groups[1].Value
          if ($actualName -ne $expectedName -or $actualCode -ne $expectedCode) {
            throw "Installed package version does not match candidate"
          }

          $requiredRuntimePermissions = @(
            "android.permission.CAMERA",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.ACCESS_FINE_LOCATION"
          )
          foreach ($permission in $requiredRuntimePermissions) {
            $permissionPattern = [regex]::Escape($permission) + ": granted=true"
            if ($installed -notmatch $permissionPattern) {
              throw "QA install did not pre-grant required runtime permission: $permission"
            }
          }

          & adb -s $serial shell input keyevent KEYCODE_WAKEUP | Out-Null
          & adb -s $serial shell wm dismiss-keyguard | Out-Null
          & adb -s $serial shell am force-stop $packageName | Out-Null
          $launch = ((& adb -s $serial shell am start -W -n "$packageName/.MainActivity") -join "`n")
          if ($LASTEXITCODE -ne 0 -or $launch -notmatch "Status:\s*ok") {
            throw "QuickQR MainActivity did not launch successfully"
          }
          Start-Sleep -Seconds 2
          $appPid = ((& adb -s $serial shell pidof $packageName) -join "").Trim()
          if ([string]::IsNullOrWhiteSpace($appPid)) {
            throw "QuickQR process is not alive after launch"
          }

          $remoteLaunchShot = "/data/local/tmp/quickqr-physical-launch.png"
          & adb -s $serial shell rm -f $remoteLaunchShot | Out-Null
          & adb -s $serial shell screencap -p $remoteLaunchShot | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Physical launch screenshot capture failed"
          }
          & adb -s $serial pull $remoteLaunchShot "physical-evidence\launch.png" | Out-Null
          $pullExit = $LASTEXITCODE
          & adb -s $serial shell rm -f $remoteLaunchShot | Out-Null
          if ($pullExit -ne 0) {
            throw "Physical launch screenshot pull failed"
          }
          $launchEvidence = Get-Item "physical-evidence\launch.png" -ErrorAction Stop
          if ($launchEvidence.Length -le 0) {
            throw "Physical launch screenshot is empty"
          }

          $accessibilityEnabled = (((& adb -s $serial shell settings get secure accessibility_enabled) -join "").Trim())
          $accessibilityServices = (((& adb -s $serial shell settings get secure enabled_accessibility_services) -join "").Trim())
          $talkBackActive = ($accessibilityEnabled -eq "1" -and $accessibilityServices -match "(?i)(talkback|marvin)")

          "version_name=$actualName" | Add-Content "physical-evidence\summary.txt"
          "version_code=$actualCode" | Add-Content "physical-evidence\summary.txt"
          "install=passed" | Add-Content "physical-evidence\summary.txt"
          "runtime_permissions_pregranted=passed" | Add-Content "physical-evidence\summary.txt"
          "launch=passed" | Add-Content "physical-evidence\summary.txt"
          "talkback_active=$($talkBackActive.ToString().ToLowerInvariant())" | Add-Content "physical-evidence\summary.txt"

      - name: Run physical camera and real-location smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $testPackage = "com.aistudio.qrgenerator.kmpzqr.test"
          $runner = "$testPackage/androidx.test.runner.AndroidJUnitRunner"
          $testSpec = "com.aistudio.qrgenerator.kmpzqr.PhysicalDeviceSmokeInstrumentedTest#physicalCameraLocationAndMapSmoke"
          $serial = $env:QUICKQR_PHYSICAL_SERIAL
          if ([string]::IsNullOrWhiteSpace($serial)) {
            throw "Bound RMX3241 serial is unavailable"
          }
          $state = ((& adb -s $serial get-state 2>&1) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
            throw "Bound RMX3241 is not in adb device state"
          }

          $testApks = @(
            Get-ChildItem "app\build\outputs\apk\androidTest\debug" -Filter "*.apk" -File
          )
          if ($testApks.Count -ne 1) {
            throw "Expected exactly one debug Android test APK; observed $($testApks.Count)"
          }
          $testInstall = ((& adb -s $serial install -r -t $testApks[0].FullName 2>&1) -join "`n")
          if ($LASTEXITCODE -ne 0 -or $testInstall -notmatch "Success") {
            "physical_test_apk_install=failed" | Add-Content "physical-evidence\summary.txt"
            throw "Physical test APK install failed: $testInstall"
          }
          "physical_test_apk_install=passed" | Add-Content "physical-evidence\summary.txt"

          $instrumentation = ((& adb -s $serial shell am instrument -w -e class $testSpec $runner 2>&1) -join "`n")
          $instrumentation | Set-Content "physical-evidence\camera-location-instrumentation.txt"
          if (
            $LASTEXITCODE -ne 0 -or
            $instrumentation -match "FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|Process crashed" -or
            $instrumentation -notmatch "OK \([1-9][0-9]* test"
          ) {
            "camera_location_map_smoke=failed" | Add-Content "physical-evidence\summary.txt"
            throw "Physical camera/location smoke failed"
          }
          "camera_location_map_smoke=passed" | Add-Content "physical-evidence\summary.txt"

      - name: Run large-font accessibility smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $serial = $env:QUICKQR_PHYSICAL_SERIAL
          if ([string]::IsNullOrWhiteSpace($serial)) {
            throw "Bound RMX3241 serial is unavailable"
          }
          $state = ((& adb -s $serial get-state 2>&1) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
            throw "Bound RMX3241 is not in adb device state"
          }
          & adb -s $serial shell settings put system font_scale 1.3 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            "large_font_core_controls=blocked_oem_write_settings" | Add-Content "physical-evidence\summary.txt"
            "accessibility_remaining_blocker=physical_font_scale_mutation_denied_by_oem" | Add-Content "physical-evidence\summary.txt"
            exit 0
          }
          New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP "quickqr-font-scale-mutated.marker") | Out-Null

          & adb -s $serial shell am force-stop com.aistudio.qrgenerator.kmpzqr | Out-Null
          Start-Sleep -Seconds 1

          $testPackage = "com.aistudio.qrgenerator.kmpzqr.test"
          $runner = "$testPackage/androidx.test.runner.AndroidJUnitRunner"
          $testSpec = "com.aistudio.qrgenerator.kmpzqr.PhysicalDeviceSmokeInstrumentedTest#largeFontCoreControlsRemainOperable"
          $instrumentation = ((& adb -s $serial shell am instrument -w -e class $testSpec $runner 2>&1) -join "`n")
          $instrumentation | Set-Content "physical-evidence\large-font-instrumentation.txt"
          if (
            $LASTEXITCODE -ne 0 -or
            $instrumentation -match "FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|Process crashed" -or
            $instrumentation -notmatch "OK \([1-9][0-9]* test"
          ) {
            throw "Large-font physical accessibility smoke failed"
          }
          "large_font_core_controls=passed" | Add-Content "physical-evidence\summary.txt"

      - name: Final live-process and crash smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packageName = "com.aistudio.qrgenerator.kmpzqr"
          $serial = $env:QUICKQR_PHYSICAL_SERIAL
          if ([string]::IsNullOrWhiteSpace($serial)) {
            throw "Bound RMX3241 serial is unavailable"
          }
          $state = ((& adb -s $serial get-state 2>&1) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
            throw "Bound RMX3241 is not in adb device state"
          }
          & adb -s $serial shell am force-stop $packageName | Out-Null
          $launch = ((& adb -s $serial shell am start -W -n "$packageName/.MainActivity") -join "`n")
          if ($LASTEXITCODE -ne 0 -or $launch -notmatch "Status:\s*ok") {
            throw "Final QuickQR relaunch failed"
          }
          Start-Sleep -Seconds 2
          $appPid = ((& adb -s $serial shell pidof $packageName) -join "").Trim()
          if ([string]::IsNullOrWhiteSpace($appPid)) {
            throw "QuickQR process is not alive after final relaunch"
          }
          "final_live_process=passed" | Add-Content "physical-evidence\summary.txt"
          "crash_anr_smoke=passed_via_instrumentation_and_live_relaunch" | Add-Content "physical-evidence\summary.txt"

      - name: Restore physical-device QA state
        if: always()
        shell: powershell
        run: |
          $packageName = "com.aistudio.qrgenerator.kmpzqr"
          $serial = $env:QUICKQR_PHYSICAL_SERIAL
          if (-not [string]::IsNullOrWhiteSpace($serial)) {
            $boundState = ((& adb -s $serial get-state 2>$null) -join "").Trim()
            if ($LASTEXITCODE -eq 0 -and $boundState -eq "device") {
            $statePath = Join-Path $env:RUNNER_TEMP "quickqr-physical-state.json"
            if (Test-Path $statePath) {
              $state = Get-Content $statePath -Raw | ConvertFrom-Json
              $fontScaleMarker = Join-Path $env:RUNNER_TEMP "quickqr-font-scale-mutated.marker"
              if ($state.fontScale -and (Test-Path $fontScaleMarker)) {
                & adb -s $serial shell settings put system font_scale $state.fontScale 2>$null | Out-Null
                if ($LASTEXITCODE -ne 0) {
                  "font_scale_restore=blocked_oem_write_settings" | Add-Content "physical-evidence\summary.txt"
                  $global:LASTEXITCODE = 0
                } else {
                  "font_scale_restore=passed" | Add-Content "physical-evidence\summary.txt"
                }
                Remove-Item $fontScaleMarker -Force -ErrorAction SilentlyContinue
              }
            }

            $testCleanup = ((& adb -s $serial uninstall com.aistudio.qrgenerator.kmpzqr.test 2>&1) -join "`n")
            if ($LASTEXITCODE -eq 0 -and $testCleanup -match "Success") {
              "physical_test_apk_cleanup=passed" | Add-Content "physical-evidence\summary.txt"
            } else {
              "physical_test_apk_cleanup=blocked_package_manager" | Add-Content "physical-evidence\summary.txt"
              $global:LASTEXITCODE = 0
            }
            }
          }

      - name: Upload sanitized physical-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-physical-device-evidence
          path: physical-evidence/
          if-no-files-found: warn
          retention-days: 7

