name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Self-test next-release version guard
        run: python .github/scripts/verify_next_release_version.py --self-test

      - name: Enforce versionCode bump when next-release is Ready
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/next-release' && github.event.pull_request.draft == false }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          python .github/scripts/verify_next_release_version.py \
            --base-ref FETCH_HEAD \
            --head-file app/build.gradle.kts

      - name: Verify project policy
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          NAMESPACE="$(sed -n 's/.*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test "$APP_ID" = "com.aistudio.qrgenerator.kmpzqr"
          test "$NAMESPACE" = "$APP_ID"
          test -n "$VERSION_NAME"
          test "${VERSION_CODE:-0}" -gt 0
          if find app/src -type f -path '*/com/example/*' | grep -q .; then
            echo "Legacy com/example source is still active"
            exit 1
          fi
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Forbidden permission found in manifest"
            exit 1
          fi
          grep -Fq "QuickQR Business v${VERSION_NAME}" metadata.json

      - name: Compile, test, lint and release bundle
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease --stacktrace

      - name: Verify Room schema outputs
        shell: bash
        run: |
          set -euo pipefail
          test -d app/schemas
          mapfile -t SCHEMAS < <(find app/schemas -type f -name '*.json' -print | sort)
          test "${#SCHEMAS[@]}" -gt 0 || { echo "No Room schema JSON was generated"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("app/schemas").rglob("*.json"))
          if not files:
              raise SystemExit("No Room schema JSON was generated")
          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f"Empty Room schema JSON: {path}")
              with path.open("r", encoding="utf-8") as handle:
                  value = json.load(handle)
              if not isinstance(value, dict):
                  raise SystemExit(f"Room schema is not a JSON object: {path}")
          print(f"PASS: validated {len(files)} Room schema JSON file(s)")
          PY

      - name: Verify built artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/quickqr-badging.txt
          grep -Fq "package: name='$APP_ID'" /tmp/quickqr-badging.txt
          grep -Fq "versionCode='$VERSION_CODE'" /tmp/quickqr-badging.txt
          grep -Fq "versionName='$VERSION_NAME'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.CAMERA'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" /tmp/quickqr-badging.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_BACKGROUND_LOCATION)" /tmp/quickqr-badging.txt; then
            echo "Forbidden permission found in built APK"
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          if unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF)$' >/dev/null; then
            echo "Expected unsigned CI AAB but signature files were found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-unsigned-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  instrumentation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator system image
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          echo "no" | avdmanager create avd \
            --force \
            --name quickqr_ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/quickqr_ci.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/quickqr-avds.txt
          grep -Fxq "quickqr_ci" /tmp/quickqr-avds.txt
          find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print

      - name: Boot Android emulator
        shell: bash
        run: |
          set -euo pipefail
          diagnose() {
            echo "=== emulator diagnostics ==="
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            ls -la "$ANDROID_AVD_HOME" || true
            find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print || true
            adb devices -l || true
            ps -ef | grep -E '[e]mulator|[q]emu' || true
            cat /tmp/quickqr-emulator.log || true
          }
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL_ARGS=(-accel on)
          else
            ACCEL_ARGS=(-accel off)
          fi
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd quickqr_ci \
            "${ACCEL_ARGS[@]}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > /tmp/quickqr-emulator.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            diagnose
            exit 124
          fi
          if ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            diagnose
            exit 124
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk
          adb devices -l

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Run Android instrumentation tests
        run: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Collect visual screenshot evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quickqr-visual
          mkdir -p /tmp/quickqr-visual
          REMOTE_VISUAL="/sdcard/Pictures/QuickQR-Visual-QA"
          if adb shell test -d "$REMOTE_VISUAL"; then
            adb pull "$REMOTE_VISUAL" /tmp/quickqr-visual
          fi
          COUNT="$(find /tmp/quickqr-visual -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Visual screenshot count: $COUNT"
          test "$COUNT" -ge 18 || { echo "Expected at least 18 runtime visual evidence PNG files"; exit 1; }

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            /tmp/quickqr-visual/
            /tmp/quickqr-emulator.log
          if-no-files-found: warn
          retention-days: 7

