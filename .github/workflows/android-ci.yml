name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify project policy
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          NAMESPACE="$(sed -n 's/.*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test "$APP_ID" = "com.aistudio.qrgenerator.kmpzqr"
          test "$NAMESPACE" = "$APP_ID"
          test -n "$VERSION_NAME"
          test "${VERSION_CODE:-0}" -gt 0
          if find app/src -type f -path '*/com/example/*' | grep -q .; then
            echo "Legacy com/example source is still active"
            exit 1
          fi
          if grep -Eq 'ACCESS_BACKGROUND_LOCATION|android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "Forbidden permission found in manifest"
            exit 1
          fi
          grep -Fq "QuickQR Business v${VERSION_NAME}" metadata.json

      - name: Compile, test, lint and release bundle
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease --stacktrace

      - name: Verify built artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APP_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -f "$APK"
          test -f "$AAB"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/quickqr-badging.txt
          grep -Fq "package: name='$APP_ID'" /tmp/quickqr-badging.txt
          grep -Fq "versionCode='$VERSION_CODE'" /tmp/quickqr-badging.txt
          grep -Fq "versionName='$VERSION_NAME'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.CAMERA'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_COARSE_LOCATION'" /tmp/quickqr-badging.txt
          grep -Fq "uses-permission: name='android.permission.ACCESS_FINE_LOCATION'" /tmp/quickqr-badging.txt
          if grep -Eq "android.permission.(INTERNET|ACCESS_BACKGROUND_LOCATION)" /tmp/quickqr-badging.txt; then
            echo "Forbidden permission found in built APK"
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          if unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF)$' >/dev/null; then
            echo "Expected unsigned CI AAB but signature files were found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-unsigned-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
