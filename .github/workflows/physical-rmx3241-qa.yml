name: QuickQR RMX3241 Physical QA

on:
  push:
    branches:
      - qa/physical-rmx3241-20261009

permissions:
  contents: read

concurrency:
  group: quickqr-rmx3241-physical-qa
  cancel-in-progress: true

jobs:
  physical-rmx3241:
    runs-on: [self-hosted, Windows, X64, dclite-project-quickqr-business]
    timeout-minutes: 30
    env:
      APP_ID: com.aistudio.qrgenerator.kmpzqr
      EXPECTED_BASE: fa237c49dc999f95d393060849e2d87328127e8c
      EXPECTED_MODEL: RMX3241
      EXPECTED_VERSION_CODE: "19"
      EXPECTED_VERSION_NAME: "18.0"

    steps:
      - name: Checkout physical QA branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify production source is exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & git fetch --no-tags origin $env:EXPECTED_BASE
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch expected candidate" }
          $changed = @(& git diff --name-only $env:EXPECTED_BASE HEAD)
          $allowed = @(
            ".github/workflows/physical-rmx3241-qa.yml",
            "app/src/androidTest/java/com/aistudio/qrgenerator/kmpzqr/PhysicalDeviceSmokeInstrumentedTest.kt"
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw ("QA branch changed production/unapproved paths: " + ($unexpected -join ", "))
          }
          Write-Host ("QA-only diff verified; candidate production base=" + $env:EXPECTED_BASE)

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify existing Android SDK on physical host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            $env:ANDROID_HOME,
            $env:ANDROID_SDK_ROOT,
            (Join-Path $env:LOCALAPPDATA "Android\Sdk"),
            (Join-Path $env:USERPROFILE "AppData\Local\Android\Sdk"),
            (Join-Path $env:USERPROFILE ".android\sdk")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

          $sdkRoot = $null
          foreach ($candidate in $candidates) {
            $platformJar = Join-Path $candidate "platforms\android-36\android.jar"
            $buildToolsCandidate = Join-Path $candidate "build-tools\36.0.0"
            if (
              (Test-Path -LiteralPath $platformJar -PathType Leaf) -and
              (Test-Path -LiteralPath $buildToolsCandidate -PathType Container)
            ) {
              $sdkRoot = [IO.Path]::GetFullPath($candidate)
              break
            }
          }
          if (-not $sdkRoot) {
            throw ("No installed Android SDK with platform 36 + build-tools 36.0.0. Checked: " + ($candidates -join "; "))
          }

          $platformTools = Join-Path $sdkRoot "platform-tools"
          $buildTools = Join-Path $sdkRoot "build-tools\36.0.0"
          ("ANDROID_HOME=" + $sdkRoot) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ("ANDROID_SDK_ROOT=" + $sdkRoot) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath $platformTools -PathType Container) {
            $platformTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          $buildTools | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host ("Existing Android SDK verified at " + $sdkRoot)

      - name: Provision isolated Gradle 9.3.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gradleUserHome = Join-Path $env:RUNNER_TEMP "quickqr-gradle-home"
          $distRoot = Join-Path $env:RUNNER_TEMP "quickqr-gradle-dist"
          $zipPath = Join-Path $env:RUNNER_TEMP "gradle-9.3.1-bin.zip"
          $gradleBin = Join-Path $distRoot "gradle-9.3.1\bin"
          $gradleExe = Join-Path $gradleBin "gradle.bat"

          New-Item -ItemType Directory -Force -Path $gradleUserHome | Out-Null
          if (-not (Test-Path -LiteralPath $gradleExe -PathType Leaf)) {
            Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" -OutFile $zipPath -UseBasicParsing
            if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
              throw "Gradle 9.3.1 distribution download did not produce a ZIP."
            }
            Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $distRoot | Out-Null
            Expand-Archive -LiteralPath $zipPath -DestinationPath $distRoot -Force
          }
          if (-not (Test-Path -LiteralPath $gradleExe -PathType Leaf)) {
            throw ("Gradle 9.3.1 executable missing after provisioning: " + $gradleExe)
          }

          ("GRADLE_USER_HOME=" + $gradleUserHome) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $gradleBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gradleExe --version
          if ($LASTEXITCODE -ne 0) { throw "Gradle 9.3.1 version probe failed" }

      - name: Verify authorized physical device
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $state = (& adb get-state 2>$null).Trim()
          if ($state -ne "device") { throw "ADB device is not ready" }
          $model = (& adb shell getprop ro.product.model).Trim()
          $abi = (& adb shell getprop ro.product.cpu.abi).Trim()
          $boot = (& adb shell getprop sys.boot_completed).Trim()
          if ($model -ne $env:EXPECTED_MODEL) { throw "Unauthorized physical model: $model" }
          if ($boot -ne "1") { throw "Physical device boot is incomplete" }
          if (-not $abi) { throw "Physical device ABI is unavailable" }
          Write-Host ("Authorized physical device verified: model=" + $model + " abi=" + $abi)

      - name: Build, unit test and lint exact candidate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Candidate build/unit/lint failed" }

      - name: Install and verify QuickQR v18 code19
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $apk = (Resolve-Path "app\build\outputs\apk\debug\app-debug.apk").Path
          $install = (& adb install -r -t $apk 2>&1) -join "`n"
          Write-Host $install
          if ($LASTEXITCODE -ne 0 -or $install -notmatch "Success") {
            throw "APK installation failed"
          }
          $packageDump = (& adb shell dumpsys package $env:APP_ID) -join "`n"
          if ($packageDump -notmatch ("versionCode=" + [regex]::Escape($env:EXPECTED_VERSION_CODE) + "(?:\s|$)")) {
            throw "Installed versionCode mismatch"
          }
          if ($packageDump -notmatch ("versionName=" + [regex]::Escape($env:EXPECTED_VERSION_NAME) + "(?:\s|$)")) {
            throw "Installed versionName mismatch"
          }
          Write-Host ("Installed package verified: " + $env:APP_ID + " v" + $env:EXPECTED_VERSION_NAME + " code" + $env:EXPECTED_VERSION_CODE)

      - name: Launch installed app and verify live process
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & adb logcat -c
          & adb shell am force-stop $env:APP_ID
          $launch = (& adb shell am start -W -n "$env:APP_ID/.MainActivity" 2>&1) -join "`n"
          Write-Host $launch
          if ($LASTEXITCODE -ne 0 -or $launch -notmatch "Status:\s+ok") {
            throw "MainActivity launch failed"
          }
          Start-Sleep -Seconds 5
          $appPid = (& adb shell pidof $env:APP_ID).Trim()
          if (-not $appPid) { throw "QuickQR process is not alive after launch" }
          Write-Host "QuickQR live process verified."

      - name: Run RMX3241 CameraX bind and rebind smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & gradle --no-daemon :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=com.aistudio.qrgenerator.kmpzqr.PhysicalDeviceSmokeInstrumentedTest" --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "RMX3241 CameraX smoke failed" }

      - name: Run full physical instrumentation and visual matrix
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & adb shell rm -rf /sdcard/Pictures/QuickQR-Visual-QA
          & gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Physical instrumentation suite failed" }

      - name: Verify physical visual evidence and final runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "physical-evidence\visual" | Out-Null
          $remoteFiles = @(& adb shell find /sdcard/Pictures/QuickQR-Visual-QA -maxdepth 1 -type f -name "*.png")
          $remoteFiles = @($remoteFiles | Where-Object { $_.Trim() })
          if ($remoteFiles.Count -lt 18) {
            throw ("Expected at least 18 physical visual PNGs; found " + $remoteFiles.Count)
          }
          & adb pull /sdcard/Pictures/QuickQR-Visual-QA "physical-evidence\visual" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Could not pull visual evidence" }

          & adb shell pm grant $env:APP_ID android.permission.CAMERA
          & adb logcat -c
          & adb shell am force-stop $env:APP_ID
          & adb shell am start -W -n "$env:APP_ID/.MainActivity" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Final launch failed" }
          Start-Sleep -Seconds 5
          $appPid = (& adb shell pidof $env:APP_ID).Trim()
          if (-not $appPid) { throw "QuickQR final process is not alive" }

          & adb shell screencap -p /sdcard/quickqr_physical_final.png
          & adb pull /sdcard/quickqr_physical_final.png "physical-evidence\quickqr_physical_final.png" | Out-Host
          & adb shell uiautomator dump /sdcard/quickqr_window.xml | Out-Host
          & adb pull /sdcard/quickqr_window.xml "physical-evidence\quickqr_window.xml" | Out-Host

          $crash = (& adb logcat -d -v brief AndroidRuntime:E "*:S" 2>&1) -join "`n"
          [IO.File]::WriteAllText(
            (Join-Path $PWD "physical-evidence\androidruntime-error.log"),
            $crash,
            (New-Object Text.UTF8Encoding($false))
          )
          if ($crash -match "FATAL EXCEPTION") {
            throw "Fatal AndroidRuntime exception observed after final launch"
          }
          Write-Host ("Physical visual evidence verified: " + $remoteFiles.Count + " PNGs; no fatal AndroidRuntime exception.")

      - name: Upload RMX3241 physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickqr-rmx3241-physical-evidence
          path: |
            physical-evidence
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 7
